<!DOCTYPE html>
<html lang="en">

<head>

    <title>Table</title>

<body>

        </thead>

            </tr>

                <td>5gb per month</td>

        </tbody>
        <tfoot>
            <tr>
                <td></td>

            </tr>
        </tfoot>
    </table>
</body>

</html>
